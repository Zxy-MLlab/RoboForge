[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-codex-harness"
version = "0.5.0"
description = "An environment-neutral coding-agent harness for autonomous robot capability acquisition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "openai>=1.66",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
openhands = ["openhands-sdk>=1.44,<2", "openhands-tools>=1.44,<2"]
libero = [
  "numpy<2",
  "torch>=2.0",
  "torchvision>=0.15",
  "robosuite==1.4.1",
  "mujoco==2.3.7; python_version < '3.12'",
  "platformdirs>=4",
  "bddl>=3.6,<4",
  "easydict>=1.13",
  "cloudpickle>=3.1",
  "gym==0.23.1",
  "transformers>=4.36",
  "timm>=0.9",
  "addict>=2.4",
  "yapf>=0.40",
  "supervision>=0.22",
  "pycocotools>=2.0",
  "Pillow>=9",
  "scipy>=1.10",
  "open3d>=0.18",
  "tensorboard>=2.14",
  "gdown>=5",
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@8f1084e3132a39270c3a13ebe37270a43ece2a01",
]

[project.scripts]
embodied_codex = "embodied_codex.cli:main"
roboforge = "roboforge.cli:main"
roboforge-openhands = "roboforge.cli:main"
roboforge-adapter-worker = "roboforge.rpc_server:main"
roboforge-promotion-service = "roboforge.promotion_service:main"

[tool.setuptools.packages.find]
include = ["embodied_codex", "embodied_codex.*", "roboforge", "roboforge.*", "evaluation", "evaluation.*", "scripts", "scripts.*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
addopts = "-ra"
