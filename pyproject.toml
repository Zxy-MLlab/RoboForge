[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-codex-harness"
version = "0.5.0"
description = "An environment-neutral coding-agent harness for autonomous robot capability acquisition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "openai>=1.40",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
libero = [
  "torch>=2.0",
  "robosuite>=1.4",
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@master",
]

[project.scripts]
embodied_codex = "embodied_codex.cli:main"
roboforge = "embodied_codex.cli:main"

[tool.setuptools.packages.find]
include = ["embodied_codex*", "evaluation"]

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
addopts = "-ra"
