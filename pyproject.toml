[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-codex-harness"
version = "0.5.0"
description = "An environment-neutral coding-agent harness for autonomous robot capability acquisition"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "jsonschema>=4.20",
  "openai>=1.40",
  "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
libero = [
  "torch>=2.0",
  "torchvision>=0.15",
  "robosuite>=1.4",
  "transformers>=4.36",
  "timm>=0.9",
  "addict>=2.4",
  "yapf>=0.40",
  "supervision>=0.22",
  "pycocotools>=2.0",
  "Pillow>=9",
  "scipy>=1.10",
  "open3d>=0.18",
  "tensorboard>=2.14",
  "gdown>=5",
  "libero @ git+https://github.com/Lifelong-Robot-Learning/LIBERO.git@8f1084e3132a39270c3a13ebe37270a43ece2a01",
]

[project.scripts]
embodied_codex = "embodied_codex.cli:main"
roboforge = "embodied_codex.cli:main"

[tool.setuptools.packages.find]
include = ["embodied_codex", "embodied_codex.*", "evaluation", "evaluation.*"]

[tool.setuptools]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests", "evaluation"]
addopts = "-ra"
